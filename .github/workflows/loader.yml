name: 247 Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-single-instance
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild bot
        env:
          APP_CODE_1: ${{ secrets.APP_CODE_1 }}
          APP_CODE_2: ${{ secrets.APP_CODE_2 }}
          APP_CODE_3: ${{ secrets.APP_CODE_3 }}
          APP_CODE_4: ${{ secrets.APP_CODE_4 }}
          APP_CODE_5: ${{ secrets.APP_CODE_5 }}
          APP_CODE_6: ${{ secrets.APP_CODE_6 }}
        run: |
          : > encoded.txt
          printf '%s' "$APP_CODE_1" >> encoded.txt
          printf '%s' "$APP_CODE_2" >> encoded.txt
          printf '%s' "$APP_CODE_3" >> encoded.txt
          printf '%s' "$APP_CODE_4" >> encoded.txt
          printf '%s' "$APP_CODE_5" >> encoded.txt
          printf '%s' "$APP_CODE_6" >> encoded.txt

          base64 -d encoded.txt > discordbot.py

          echo "Bot file rebuilt:"
          wc -c discordbot.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests Pillow

      - name: Start bot
        run: |
          python discordbot.py
